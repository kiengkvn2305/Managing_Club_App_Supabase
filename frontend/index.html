<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FCMS PRO" />
    <meta
      name="description"
      content="FCMS PRO — Không gian quản lý câu lạc bộ bóng đá của bạn."
    />
    <link rel="icon" href="/icons/crest.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FCMS PRO · Quản lý câu lạc bộ</title>
    <script>
      try {
        const t = localStorage.getItem('fcms-theme');
        const mode = t === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = mode;
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', mode === 'light' ? '#eef3f7' : '#07111e');
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Đến nội dung chính</a>
    <div id="app">
      <main id="main-content" class="boot-screen">
        <span class="boot-mark">F</span>
        <p>Đang kết nối câu lạc bộ…</p>
      </main>
    </div>
    <div
      id="toast-region"
      class="toast-region"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <noscript>Vui lòng bật JavaScript để sử dụng FCMS PRO.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
